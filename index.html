<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sudoku Game</title>

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    color: white;
}

.container {
    text-align: center;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
}

.timer {
    color: #00e5ff;
    font-weight: bold;
    margin-bottom: 10px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(9, 48px);
    grid-template-rows: repeat(9, 48px);
    gap: 4px;
    margin: 20px auto;
}

.cell {
    border-radius: 10px;
    border: none;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    background: rgba(255,255,255,0.08);
    color: white;
}

.cell:focus {
    outline: none;
    background: #00e5ff;
    color: black;
    box-shadow: 0 0 10px #00e5ff;
}

.prefilled { background: rgba(255,255,255,0.15); color: #ffd54f; }
.invalid { background: #ff5252 !important; }

.box-border-right { border-right: 3px solid #00e5ff; }
.box-border-bottom { border-bottom: 3px solid #00e5ff; }

button {
    padding: 10px 18px;
    margin: 6px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(45deg, #00e5ff, #2979ff);
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.modal {
    position: fixed;
    top:0;left:0;width:100%;height:100%;
    background: rgba(0,0,0,0.6);
    display:none;
    justify-content:center;
    align-items:center;
}

.modal-content {
    background:#1e1e1e;
    padding:25px;
    border-radius:15px;
}
</style>
</head>

<body>
<div class="container">
    <h1>Sudoku</h1>
    <div class="timer">Time: <span id="time">00:00</span></div>
    <div class="grid" id="grid"></div>
    <button onclick="checkSolution()">Check</button>
    <button onclick="resetGame()">Reset</button>
    <button onclick="newGame()">New Game</button>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <h2>🎉 Puzzle Solved!</h2>
        <p>Time: <span id="finalTime"></span></p>
        <button onclick="closeModal()">Close</button>
    </div>
</div>

<script>
const puzzles=[
{puzzle:[[5,3,0,0,7,0,0,0,0],[6,0,0,1,9,5,0,0,0],[0,9,8,0,0,0,0,6,0],[8,0,0,0,6,0,0,0,3],[4,0,0,8,0,3,0,0,1],[7,0,0,0,2,0,0,0,6],[0,6,0,0,0,0,2,8,0],[0,0,0,4,1,9,0,0,5],[0,0,0,0,8,0,0,7,9]],
solution:[[5,3,4,6,7,8,9,1,2],[6,7,2,1,9,5,3,4,8],[1,9,8,3,4,2,5,6,7],[8,5,9,7,6,1,4,2,3],[4,2,6,8,5,3,7,9,1],[7,1,3,9,2,4,8,5,6],[9,6,1,5,3,7,2,8,4],[2,8,7,4,1,9,6,3,5],[3,4,5,2,8,6,1,7,9]]},
{puzzle:[[0,2,0,6,0,8,0,0,0],[5,8,0,0,0,9,7,0,0],[0,0,0,0,4,0,0,0,0],[3,7,0,0,0,0,5,0,0],[6,0,0,0,0,0,0,0,4],[0,0,8,0,0,0,0,1,3],[0,0,0,0,2,0,0,0,0],[0,0,9,8,0,0,0,3,6],[0,0,0,3,0,6,0,9,0]],
solution:[[1,2,3,6,7,8,9,4,5],[5,8,4,2,3,9,7,6,1],[9,6,7,1,4,5,3,2,8],[3,7,2,4,6,1,5,8,9],[6,9,1,5,8,3,2,7,4],[4,5,8,7,9,2,6,1,3],[8,3,6,9,2,4,1,5,7],[2,1,9,8,5,7,4,3,6],[7,4,5,3,1,6,8,9,2]]}
];

let currentPuzzle,currentSolution,timerInterval,seconds=0;

function startTimer(){
timerInterval=setInterval(()=>{
seconds++;
time.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
},1000);
}

function createGrid(p){
grid.innerHTML="";
for(let r=0;r<9;r++){
for(let c=0;c<9;c++){
const i=document.createElement("input");
i.maxLength=1;i.className="cell";
i.dataset.row=r;i.dataset.col=c;
if(p[r][c]!==0){i.value=p[r][c];i.readOnly=true;i.classList.add("prefilled");}
if((c+1)%3===0&&c!==8)i.classList.add("box-border-right");
if((r+1)%3===0&&r!==8)i.classList.add("box-border-bottom");
i.addEventListener("input",validateInput);
grid.appendChild(i);
}}}

function validateInput(e){
if(!/^[1-9]$/.test(e.target.value)){e.target.value="";return;}
checkDuplicates();
}

function checkDuplicates(){
document.querySelectorAll(".cell").forEach(c=>c.classList.remove("invalid"));
const cells=[...document.querySelectorAll(".cell")];
cells.forEach(cell=>{
if(!cell.value)return;
cells.forEach(o=>{
if(cell!==o&&o.value===cell.value){
const r=+cell.dataset.row,c=+cell.dataset.col,r2=+o.dataset.row,c2=+o.dataset.col;
if(r===r2||c===c2||(Math.floor(r/3)===Math.floor(r2/3)&&Math.floor(c/3)===Math.floor(c2/3))){
cell.classList.add("invalid");o.classList.add("invalid");
}}});});
}

function checkSolution(){
checkDuplicates();
if(document.querySelectorAll(".invalid").length>0){alert("Fix errors!");return;}
document.querySelectorAll(".cell").forEach(cell=>{
if(parseInt(cell.value)!==currentSolution[cell.dataset.row][cell.dataset.col]){alert("Incorrect solution!");throw"";}
});
clearInterval(timerInterval);
finalTime.textContent=time.textContent;
modal.style.display="flex";
}

function resetGame(){document.querySelectorAll(".cell").forEach(c=>{if(!c.readOnly)c.value="";c.classList.remove("invalid");});}

function newGame(){
seconds=0;clearInterval(timerInterval);time.textContent="00:00";
const r=Math.floor(Math.random()*puzzles.length);
currentPuzzle=puzzles[r].puzzle;
currentSolution=puzzles[r].solution;
createGrid(currentPuzzle);startTimer();
}

function closeModal(){modal.style.display="none";}

const grid=document.getElementById("grid");
const time=document.getElementById("time");
const modal=document.getElementById("modal");
const finalTime=document.getElementById("finalTime");

newGame();
</script>
</body>
</html>
